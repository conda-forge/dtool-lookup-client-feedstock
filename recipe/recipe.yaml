schema_version: 1

context:
  name: dtool-lookup-client
  version: "0.1.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/dtool_lookup_client/dtool_lookup_client-${{ version }}.tar.gz
  sha256: c949f73c9423c9986a690177eb3651f4a51c7c32a3cfebd473b91bb71cf4f966

build:
  number: 2
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools
  run:
    - click
    - dtool_cli >=0.6.0
    - dtool_config >=0.1.1
    - dtoolcore >=3.9.0
    - pygments
    - python >=${{ python_min }}
    - requests

tests:
  - python:
      imports:
        - dtool_lookup_client
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: MIT
  license_file: LICENSE.rst
  summary: Dtool plugin for interacting with dtool lookup server(s)
  description: |
    Dtool plugin for interacting with dtool lookup server(s)
  homepage: https://github.com/jic-dtool/dtool-lookup-client
  repository: https://github.com/jic-dtool/dtool-lookup-client
  documentation: https://github.com/jic-dtool/dtool-lookup-client

extra:
  recipe-maintainers:
    - jan-janssen
